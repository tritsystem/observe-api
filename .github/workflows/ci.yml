name: tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        # test_concept_shakedown.py and test_spiking_integrations.py fail
        # to even collect (ModuleNotFoundError: 'compiler') -- a real,
        # pre-existing packaging gap for those two Spikeling-integration
        # side-features (not the core search/billing API this CI is
        # hardening), found while setting this up. Scoped out explicitly
        # rather than silently passing on a suite that can't collect;
        # fixing that packaging gap is its own separate task.
        run: python -m pytest -q tests/test_db.py tests/test_env_config.py tests/test_server.py
        env:
          # Tests never make real Stripe/network/model calls (see
          # tests/conftest.py's own docstring) -- these are placeholder
          # values only so module-level `os.environ.get(...)` reads in
          # server.py/billing.py don't blow up on import, not real
          # credentials. Real secrets are never present in CI.
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
