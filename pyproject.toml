[project]
name = "observe-search-tools"
version = "0.1.0"
description = "Client tools for the hosted OBSERVE Search API -- pay-per-query semantic code search and ACP-compatible agentic commerce discovery. CLI + MCP server + LangChain + CrewAI wrappers, sharing one client core so behavior is identical across all of them."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gavin Branaa", email = "gbranaa4@gmail.com" }]
keywords = ["semantic search", "code search", "mcp", "agentic commerce", "api client", "langchain", "crewai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/tritsystem/observe-api"
Repository = "https://github.com/tritsystem/observe-api"
Issues = "https://github.com/tritsystem/observe-api/issues"
Changelog = "https://github.com/tritsystem/observe-api/blob/master/CHANGELOG.md"

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
langchain = ["langchain-core>=0.2", "pydantic>=2"]
crewai = ["crewai>=0.30", "pydantic>=2"]
all = ["mcp>=1.0", "langchain-core>=0.2", "crewai>=0.30", "pydantic>=2"]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27", "pydantic[email]>=2.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
observe-search-mcp = "observe_search_mcp.server:main"
observe = "observe_search_tools.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["observe_search_mcp*", "observe_search_tools*"]
