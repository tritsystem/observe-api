services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - observe_data:/data
      - /root/observe-repos-data:/home/gbran/observe-api/repos:ro
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  observe_data:
  caddy_data:
  caddy_config:
